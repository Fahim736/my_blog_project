<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'blog:home' %}">DevBlog</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{% url 'blog:home' %}">Home</a>
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'blog:my_posts' %}">My Posts</a>
                    <a class="nav-link" href="{% url 'blog:create_post' %}">New Post</a>
                {% endif %}
            </div>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="nav-link text-light me-2">Hello, {{ user.username }}</span>
                    <form action="{% url 'blog:logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link d-inline" style="border:none; background:none;">Logout</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'blog:login' %}">Login</a>
                    <a class="btn btn-primary ms-2" href="{% url 'blog:register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container my-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; DevBlog. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
