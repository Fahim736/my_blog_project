{% extends 'blog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Recent Posts</h1>
    <div class="row">
        {% for post in posts %}
            <div class="col-md-6 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title">
                            <a href="{% url 'blog:post_detail' post.pk %}" class="text-decoration-none text-dark">{{ post.title }}</a>
                        </h3>
                        <p class="text-muted small">
                            By {{ post.author.username }} | {{ post.created_at|date:"M d, Y" }}
                        </p>
                        <p class="card-text">{{ post.content|truncatewords:30 }}</p>
                        <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-outline-primary btn-sm">Read More &rarr;</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>No posts available yet.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
